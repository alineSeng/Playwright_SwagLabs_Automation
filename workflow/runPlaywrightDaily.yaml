name: Run Playwright Tests Daily

on:
  schedule:
    # Exécution quotidienne à 10h UTC (ajuster selon votre fuseau horaire si nécessaire)
    - cron: "0 10 * * *"

  # Exécution manuelle possible via l'interface GitHub
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Vérifier le code depuis le repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Étape 2 : Configurer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Modifier si nécessaire

      # Étape 3 : Installer les dépendances
      - name: Install dependencies
        run: npm install

      # Étape 4 : Lancer les tests Playwright avec Cucumber
      - name: Run Playwright tests
        run: npm run test

      # Étape 5 : Générer le rapport HTML
      - name: Generate Test Report
        run: npm run report

      # Étape 6 : Sauvegarder le rapport comme artefact GitHub
      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: report/cucumber_report.json
